[project]
name = "craw"
version = "0.0.1"
description = "A creature that lives in your shell."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]   # for talking to ollama later
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
craw = "craw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craw"]

[tool.ruff]
line-length = 100
target-version = "py311"